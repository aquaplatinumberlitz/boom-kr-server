name: Rust

on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'tools/l10n_949x.py'
      - 'tools/text949x_reference.py'
      - 'tools/test_m8_binary_rollback.py'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'tools/l10n_949x.py'
      - 'tools/text949x_reference.py'
      - 'tools/test_m8_binary_rollback.py'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install 2>/dev/null || rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust with the independent CP949 and 949x reference
        run: |
          mkdir -p ../local
          python3 ../tools/text949x_reference.py --oracle-out ../local/text949x-oracle.bin
          KR_TEXT949X_ORACLE="$PWD/../local/text949x-oracle.bin" cargo test --workspace --locked
      - name: Test rollback with the previous schema-5 binary
        run: |
          baseline=19982f41e5e9b5c2a56fcc993b5d4a92f1f7b7d5
          git fetch --no-tags --depth 1 origin "$baseline"
          previous=$(mktemp -d)
          git archive "$baseline" rust | tar -x -C "$previous"
          CARGO_TARGET_DIR="$PWD/target/m8-schema5" cargo build --manifest-path "$previous/rust/Cargo.toml" --locked -p kr-service --bin kr-admin
          python3 ../tools/test_m8_binary_rollback.py --previous "$PWD/target/m8-schema5/debug" --current "$PWD/target/debug"
          rm -rf "$previous"
