name: Rust

on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - '.cargo/config.toml'
      - 'tools/kr_windows_linker.py'
      - 'tools/player_package.py'
      - 'tools/test_player_package.py'
      - 'tools/player_windows_setup.ps1'
      - 'tools/l10n_949x.py'
      - 'tools/text949x_reference.py'
      - 'tools/test_m8_binary_rollback.py'
      - 'tools/*kr_pack*.py'
      - 'tools/rust*package*.py'
      - 'tools/content_census.py'
      - 'tools/export_map_profile.py'
      - 'tools/rust_map_profile.py'
      - 'server/probe_codec.py'
      - 'server/room_title.py'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.cargo/config.toml'
      - 'tools/kr_windows_linker.py'
      - 'tools/player_package.py'
      - 'tools/test_player_package.py'
      - 'tools/player_windows_setup.ps1'
      - 'tools/l10n_949x.py'
      - 'tools/text949x_reference.py'
      - 'tools/test_m8_binary_rollback.py'
      - 'tools/*kr_pack*.py'
      - 'tools/rust*package*.py'
      - 'tools/content_census.py'
      - 'tools/export_map_profile.py'
      - 'tools/rust_map_profile.py'
      - 'server/probe_codec.py'
      - 'server/room_title.py'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install 2>/dev/null || rustup show
      - name: Verify O1 exports the original player pack
        run: python3 ../tools/test_player_package.py PackageTests.test_friends_uses_original_prefix_and_original_index
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust with the independent CP949 and 949x reference
        run: |
          mkdir -p ../local
          python3 ../tools/text949x_reference.py --oracle-out ../local/text949x-oracle.bin
          KR_TEXT949X_ORACLE="$PWD/../local/text949x-oracle.bin" cargo test --workspace --locked
      - name: Test rollback with the previous schema-5 binary
        run: |
          baseline=19982f41e5e9b5c2a56fcc993b5d4a92f1f7b7d5
          git fetch --no-tags --depth 1 origin "$baseline"
          previous=$(mktemp -d)
          git -C .. archive "$baseline" rust | tar -x -C "$previous"
          CARGO_TARGET_DIR="$PWD/target/m8-schema5" cargo build --manifest-path "$previous/rust/Cargo.toml" --locked -p kr-service --bin kr-admin
          python3 ../tools/test_m8_binary_rollback.py --previous "$PWD/target/m8-schema5/debug" --current "$PWD/target/debug"
          rm -rf "$previous"

  pack-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install 2>/dev/null || rustup show
      - name: Build Linux package binaries
        working-directory: rust
        run: >
          cargo build --locked -p kr-service -p kr-tunnel
          --bin kr-service --bin kr-admin --bin kr-load --bin kr-companion --bin kr-launch-identity
      - name: Install, export fake pack, finish one TLS round, back up and stop
        run: python3 tools/test_kr_pack_install.py --binaries rust/target/debug

  windows-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and the pinned Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup toolchain install 2>/dev/null || rustup show
          rustup target add x86_64-pc-windows-gnu
      - name: Build Windows launcher, companion, server and provisioning binaries
        run: >
          cargo build --locked --target x86_64-pc-windows-gnu -p kr-service -p kr-tunnel -p kr-player
          --bin kr-service --bin kr-admin --bin kr-launch-identity --bin kr-player --bin kr-prelogin
