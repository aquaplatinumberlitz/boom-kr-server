name: Docs and Python tools

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==13.0.0
      - run: python3 tools/check_docs.py
      - run: python3 tools/content_census.py --check
      - run: python3 tools/content_classification.py --check
      - name: Test Python tools
        env:
          PYTHONPATH: tools
        run: >-
          python3 -m unittest
          tools.test_feature_catalog
          tools.test_checkpoint_absolute_local
          tools.test_checkpoint_audit_order
          tools.test_checkpoint_source_history
          tools.test_checkpoint_store
          tools.test_checkpoints
          tools.test_checkpoint_evidence_lean
          tools.test_local_retention
          tools.test_m8_udp_profile
          tools.test_m8_soak_collect
          tools.test_rust_service_package
          tools.test_kr_pack_items
          tools.test_kr_f4_catalog_export
          tools.test_f1_character_profiles
          tools.test_f1_pack_matrix
          tools.test_player_package
          tools.test_export_preset
          tools.test_four_bundle
          tools.test_issue_links
          tools.test_l10n_utf8_codec
          tools.test_l10n_utf8_core
          tools.test_l10n_949x_patch
          tools.test_l10n_949x_ui_limits
          tools.test_l10n_utf8_glyph_probe
          tools.test_probe_channel_identity
          tools.test_terrain_shadow
          tools.test_native_client_controller
