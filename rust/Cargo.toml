[workspace]
members = ["crates/kr-wire", "crates/kr-service", "crates/kr-tunnel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
getrandom = "=0.4.3"
zeroize = "=1.9.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
