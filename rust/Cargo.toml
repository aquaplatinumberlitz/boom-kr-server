[workspace]
members = ["crates/kr-wire", "crates/kr-service"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
