[package]
name = "kr-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kr-p2p = { path = "../kr-p2p" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
tokio.workspace = true
kr-tunnel = { path = "../kr-tunnel" }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "tokio", "canvas", "image-without-codecs", "advanced-shaping"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
