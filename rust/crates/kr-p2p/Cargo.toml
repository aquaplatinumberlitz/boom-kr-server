[package]
name = "kr-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
lab = ["dep:iroh-relay", "dep:rcgen", "dep:rustls"]

[dependencies]
data-encoding = "=2.11.1"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.5.0", optional = true, default-features = false, features = ["server"] }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
sha2.workspace = true
tokio.workspace = true

[[example]]
name = "udp_lab"
required-features = ["lab"]
