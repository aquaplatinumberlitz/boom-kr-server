[package]
name = "kr-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
lab = ["iroh-relay/server", "dep:rcgen", "dep:rustls"]

[dependencies]
data-encoding = "=2.11.1"
mdns-sd = { version = "=0.22.0", default-features = false, features = ["async"] }
serde.workspace = true
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-relay = { version = "=1.5.0", default-features = false }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
sha2.workspace = true
tokio.workspace = true

[[example]]
name = "udp_lab"
required-features = ["lab"]
