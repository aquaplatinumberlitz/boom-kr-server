<!doctype html><meta charset="utf-8"><title>Boom KR Web Shop</title>
<style>body{font:16px sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}button,select,input{font:inherit;padding:.4rem;margin:.2rem}li{margin:.4rem 0}.muted{color:#666}</style>
<h1>Boom KR Web Shop</h1><p class="muted">Local shop session</p>
<label>Bearer token <input id="token" type="password" size="48" autocomplete="off"></label><button onclick="load()">Load</button>
<p id="balance"></p>
<h2>Equipped</h2><p id="selection-note" class="muted" hidden>These selections are for this shop session.</p><ul id="equipped"></ul>
<h2>Inventory</h2><ul id="inventory"></ul>
<h2>Catalog</h2>
<label>Category <select id="category" onchange="loadCatalog()"><option value="">All</option><option>character</option><option>decoration</option><option>emotion</option><option>consumable</option><option>collection</option></select></label><ul id="items"></ul><pre id="message"></pre>
<h2>Social</h2><p><button onclick="loadSocial()">Refresh social</button></p><p id="social-status" class="muted"></p><h3>Guild</h3><p id="guild"></p><ul id="guild-members"></ul><h3>Friends</h3><ul id="friends"></ul><h3>Incoming friend requests</h3><ul id="incoming-requests"></ul><h3>Outgoing friend requests</h3><ul id="outgoing-requests"></ul><h3>Blocks</h3><ul id="blocks"></ul>
<script>
const q=x=>document.querySelector(x);
if(location.hash.startsWith('#token=')){q('#token').value=decodeURIComponent(location.hash.slice(7));history.replaceState(null,'',location.pathname);}
async function api(path,opt={}){const t=q('#token').value.trim(); opt.headers={...(opt.headers||{}),Authorization:'Bearer '+t}; if(opt.body)opt.headers['Content-Type']='application/json'; const r=await fetch(path,opt); const j=await r.json().catch(()=>({})); if(!r.ok)throw Error(j.error||r.status); return j}
async function load(){try{q('#message').textContent='';const p=await api('/api/v1/profile');q('#balance').textContent=`Level ${p.level} · EXP ${p.exp} · Lucci: ${p.lucci} (${p.mode})`; await Promise.all([loadInventory(),loadCatalog()])}catch(e){q('#message').textContent=String(e)}}
async function loadSocial(){try{const [f,b,r,g]=await Promise.all([api('/api/social/friends'),api('/api/social/blocks'),api('/api/social/ranking?limit=10'),api('/api/social/guild')]);for(const [id,rows] of [['#friends',f.friends],['#blocks',b.blocks]]){const ul=q(id);ul.replaceChildren();for(const value of rows){const li=document.createElement('li');li.textContent=String(value);ul.append(li)}}
const renderRequests=(id,rows,respond)=>{const ul=q(id);ul.replaceChildren();for(const request of rows){const li=document.createElement('li');li.textContent=`${request.sender_id} → ${request.recipient_id} `;if(respond){for(const [label,accept] of [['Accept',true],['Reject',false]]){const button=document.createElement('button');button.textContent=label;button.addEventListener('click',()=>respond(request.sender_id,accept));li.append(button)}}ul.append(li)}};
renderRequests('#incoming-requests',f.incoming_requests||[],async(sender,accept)=>{try{await api('/api/social/friends/respond',{method:'POST',body:JSON.stringify({requester_player_id:sender,accept})});await loadSocial()}catch(e){q('#social-status').textContent=String(e)}});renderRequests('#outgoing-requests',f.outgoing_requests||[],null);
const guild=q('#guild'),members=q('#guild-members');guild.textContent=g.guild?`${g.guild.name} · leader ${g.guild.leader_player_id}`:'No guild';members.replaceChildren();for(const member of g.members){const li=document.createElement('li');li.textContent=`${member.player_id} · ${member.role}`;members.append(li)}q('#social-status').textContent=`Ranking entries: ${r.ranking.length}`}catch(e){q('#social-status').textContent=String(e)}}
async function loadInventory(){try{const d=await api('/api/v1/inventory');const eq=q('#equipped');eq.replaceChildren();for(const e of d.equipped){const li=document.createElement('li');const b=document.createElement('b');b.textContent=e.slot;li.append(b,` · ${e.sku_id} `);const btn=document.createElement('button');btn.textContent='Unequip';btn.addEventListener('click',()=>unequip(e.slot));li.append(btn);eq.append(li)}const inv=q('#inventory');inv.replaceChildren();for(const i of d.inventory){const li=document.createElement('li');const b=document.createElement('b');b.textContent=i.sku_id;const st=i.active?'active':'expired';const slots=i.equipped_slots&&i.equipped_slots.length?` · equipped: ${i.equipped_slots.join(',')}`:'';li.append(b,` · ${i.grant_kind} · qty ${i.quantity} · ${st}${slots} `);if(i.active){const btn=document.createElement('button');btn.textContent='Equip';btn.addEventListener('click',()=>equip(i.sku_id));li.append(btn)}inv.append(li)}}catch(e){q('#message').textContent=String(e)}}
async function loadCatalog(){
  try {
    const c=q('#category').value;
    const d=await api('/api/v1/catalog'+(c?'?category='+c:''));
    const o1=d.mode==='unlock_all';
    q('#selection-note').hidden=!o1;
    const ul=q('#items');
    ul.replaceChildren();
    for(const i of d.items){
      const li=document.createElement('li');
      const b=document.createElement('b');
      b.textContent=i.sku_id;
      li.append(b,` · ${i.category} · ${o1?'usable in this session':i.price_lucci+' Lucci · '+(i.usable?'usable':'not owned')} `);
      if(!o1){
        const button=document.createElement('button');
        button.textContent='Buy';
        button.addEventListener('click',()=>buy(i.sku_id));
        li.append(button);
      }
      if(!o1 || (i.usable && i.equip_slot)){
        const button=document.createElement('button');
        button.textContent='Equip';
        button.addEventListener('click',()=>equip(i.sku_id));
        li.append(button);
      }
      ul.append(li);
    }
  } catch(e) {
    q('#message').textContent=String(e);
  }
}
async function buy(sku){try{await api('/api/v1/purchase',{method:'POST',body:JSON.stringify({sku,request_id:crypto.randomUUID()})});q('#message').textContent='Purchased';await load()}catch(e){q('#message').textContent=String(e)}}
async function equip(sku){try{await api('/api/v1/equip',{method:'POST',body:JSON.stringify({sku})});q('#message').textContent='Equipped';await load()}catch(e){q('#message').textContent=String(e)}}
async function unequip(slot){try{await api('/api/v1/unequip',{method:'POST',body:JSON.stringify({slot})});q('#message').textContent='Unequipped';await load()}catch(e){q('#message').textContent=String(e)}}
if(q('#token').value.trim())load();
if(q('#token').value.trim())loadSocial();
</script>
