[package]
name = "kr-service"
default-run = "kr-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kr-wire = { path = "../kr-wire" }
kr-tunnel = { path = "../kr-tunnel" }
quinn.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
argon2.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
zeroize.workspace = true
flate2.workspace = true
[target.'cfg(windows)'.dependencies]
ring = "=0.17.14"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
ring = "=0.17.14"
